name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Check types
        run: yarn check-types

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

  coloring:
    name: Coloring generator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/coloring
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/coloring/requirements-*.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Prepare pinned offline models
        run: python scripts/prepare_models.py
      - name: Test
        run: python -m pytest -q
      - name: Build and check installed package
        run: |
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
          python scripts/verify_install.py
          coloring-generate --help

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: site
            dockerfile: apps/site/Dockerfile
          - app: admin
            dockerfile: apps/admin/Dockerfile
          - app: affiliate
            dockerfile: apps/affiliate/Dockerfile
            build_args: NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://artmate.ru' }}
          - app: tg
            dockerfile: apps/tg/Dockerfile
          - app: coloring
            dockerfile: services/coloring/Dockerfile
          - app: studio
            dockerfile: apps/studio/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: artmate-${{ matrix.app }}:ci
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
