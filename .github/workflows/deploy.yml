name: Deploy Production

on:
  workflow_run:
    workflows:
      - Docker Publish
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag to deploy
        required: true
        default: latest

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            image_tag="${{ inputs.tag }}"
          else
            image_tag="latest"
          fi

          printf 'tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose files
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        shell: bash
        run: |
          ssh "$PRODUCTION_USER@$PRODUCTION_HOST" 'sudo mkdir -p /opt/artmate/infra/caddy && sudo chown -R "$USER:$USER" /opt/artmate'
          scp docker-compose.prod.yml "$PRODUCTION_USER@$PRODUCTION_HOST:/opt/artmate/docker-compose.prod.yml"
          scp infra/caddy/Caddyfile "$PRODUCTION_USER@$PRODUCTION_HOST:/opt/artmate/infra/caddy/Caddyfile"

      - name: Upload production env
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL || vars.ACME_EMAIL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}
          ADMIN_URL: ${{ secrets.ADMIN_URL || vars.ADMIN_URL }}
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL || vars.API_PUBLIC_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
          YANDEX_METRIKA_ID: ${{ secrets.YANDEX_METRIKA_ID || vars.YANDEX_METRIKA_ID }}
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID || vars.GOOGLE_ANALYTICS_ID }}
          AUTH_COOKIE_DOMAIN: ${{ secrets.AUTH_COOKIE_DOMAIN || vars.AUTH_COOKIE_DOMAIN }}
          AUTH_SUCCESS_REDIRECT_URL: ${{ secrets.AUTH_SUCCESS_REDIRECT_URL || vars.AUTH_SUCCESS_REDIRECT_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN || vars.CORS_ORIGIN }}
          SWAGGER_ENABLED: ${{ secrets.SWAGGER_ENABLED || vars.SWAGGER_ENABLED }}
          CONTENT_ASSISTANT_DEFAULT_BLOG_AUTHOR_ID: ${{ secrets.CONTENT_ASSISTANT_DEFAULT_BLOG_AUTHOR_ID }}
          CONTENT_ASSISTANT_DEFAULT_BLOG_CATEGORY_ID: ${{ secrets.CONTENT_ASSISTANT_DEFAULT_BLOG_CATEGORY_ID }}
          CONTENT_ASSISTANT_TELEGRAM_APPROVAL_CHAT_ID: ${{ secrets.CONTENT_ASSISTANT_TELEGRAM_APPROVAL_CHAT_ID }}
          CONTENT_ASSISTANT_TELEGRAM_BOT_TOKEN: ${{ secrets.CONTENT_ASSISTANT_TELEGRAM_BOT_TOKEN }}
          CONTENT_ASSISTANT_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.CONTENT_ASSISTANT_TELEGRAM_WEBHOOK_SECRET }}
          EDGE_PROXY_DOMAIN: ${{ secrets.EDGE_PROXY_DOMAIN }}
          AI_RELAY_DOMAIN: ${{ secrets.AI_RELAY_DOMAIN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
