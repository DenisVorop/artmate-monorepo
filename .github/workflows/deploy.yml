          append_secret CDEK_DEFAULT_FROM_CITY_CODE "$CDEK_DEFAULT_FROM_CITY_CODE"
          append_secret CDEK_DEFAULT_TARIFF_CODE "$CDEK_DEFAULT_TARIFF_CODE"
          append_secret CDEK_DEFAULT_ITEM_WEIGHT_GRAMS "$CDEK_DEFAULT_ITEM_WEIGHT_GRAMS"
          append_secret CDEK_DEFAULT_PACKAGE_LENGTH_CM "$CDEK_DEFAULT_PACKAGE_LENGTH_CM"
          append_secret CDEK_DEFAULT_PACKAGE_WIDTH_CM "$CDEK_DEFAULT_PACKAGE_WIDTH_CM"
          append_secret CDEK_DEFAULT_PACKAGE_HEIGHT_CM "$CDEK_DEFAULT_PACKAGE_HEIGHT_CM"
          append_secret CDEK_ORDER_CREATION_ENABLED "$CDEK_ORDER_CREATION_ENABLED"
          append_secret CDEK_ORDER_TYPE "$CDEK_ORDER_TYPE"
          append_secret CDEK_SHIPMENT_POINT_CODE "$CDEK_SHIPMENT_POINT_CODE"
          append_secret CDEK_WEBHOOK_SECRET "$CDEK_WEBHOOK_SECRET"

          bash infra/validate-prod-env.sh --env-file "$production_env"

          image_env="$(mktemp)"
          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > "$image_env"
          docker compose --env-file "$production_env" --env-file "$image_env" -f docker-compose.prod.yml config --quiet

          ssh "$PRODUCTION_USER@$PRODUCTION_HOST" 'cat > /opt/artmate/.env && chmod 600 /opt/artmate/.env' < "$production_env"

      - name: Login to GHCR on server
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        shell: bash
        run: |
          if [ -n "$GHCR_READ_TOKEN" ]; then
            printf '%s\n' "$GHCR_READ_TOKEN" | ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          fi

      - name: Login to Docker Hub on server
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        shell: bash
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            printf '%s\n' "$DOCKERHUB_TOKEN" | ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "docker login docker.io -u '$DOCKERHUB_USERNAME' --password-stdin"
          fi

      - name: Deploy
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        shell: bash
        run: |
          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" | ssh "$PRODUCTION_USER@$PRODUCTION_HOST" 'cat > /opt/artmate/.image.env'

          ssh "$PRODUCTION_USER@$PRODUCTION_HOST" '
            set -eu
            cd /opt/artmate
            docker compose --env-file .env --env-file .image.env -f docker-compose.prod.yml pull
            docker compose --env-file .env --env-file .image.env -f docker-compose.prod.yml up -d postgres
            docker compose --env-file .env --env-file .image.env -f docker-compose.prod.yml --profile migrate run --rm api-migrate
            docker compose --env-file .env --env-file .image.env -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          '
