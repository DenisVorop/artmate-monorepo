          TELEGRAM_API_RELAY_TOKEN: ${{ secrets.TELEGRAM_API_RELAY_TOKEN || secrets.OPENAI_RELAY_TOKEN || secrets.EDGE_PROXY_TOKEN || secrets.AI_RELAY_TOKEN }}
