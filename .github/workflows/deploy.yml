          append_secret AUTH_TELEGRAM_LINK_CODE_SECRET "$AUTH_TELEGRAM_LINK_CODE_SECRET"
          append_secret AUTH_TELEGRAM_LINK_CODE_TTL_SECONDS "$AUTH_TELEGRAM_LINK_CODE_TTL_SECONDS"
          append_secret AUTH_TELEGRAM_LINK_CODE_MAX_ATTEMPTS "$AUTH_TELEGRAM_LINK_CODE_MAX_ATTEMPTS"
          append_secret AUTH_TELEGRAM_LINK_CODE_RESEND_COOLDOWN_SECONDS "$AUTH_TELEGRAM_LINK_CODE_RESEND_COOLDOWN_SECONDS"
          append_secret AUTH_PASSWORD_RESET_SECRET "$AUTH_PASSWORD_RESET_SECRET"
          append_secret AUTH_PASSWORD_RESET_URL "$AUTH_PASSWORD_RESET_URL"
          append_secret AUTH_PASSWORD_RESET_TOKEN_TTL_SECONDS "$AUTH_PASSWORD_RESET_TOKEN_TTL_SECONDS"
          append_secret AUTH_PASSWORD_RESET_RESEND_COOLDOWN_SECONDS "$AUTH_PASSWORD_RESET_RESEND_COOLDOWN_SECONDS"
