          CDEK_DEFAULT_TARIFF_CODE: ${{ secrets.CDEK_DEFAULT_TARIFF_CODE || vars.CDEK_DEFAULT_TARIFF_CODE }}
          CDEK_DEFAULT_ITEM_WEIGHT_GRAMS: ${{ secrets.CDEK_DEFAULT_ITEM_WEIGHT_GRAMS || vars.CDEK_DEFAULT_ITEM_WEIGHT_GRAMS }}
          CDEK_DEFAULT_PACKAGE_LENGTH_CM: ${{ secrets.CDEK_DEFAULT_PACKAGE_LENGTH_CM || vars.CDEK_DEFAULT_PACKAGE_LENGTH_CM }}
          CDEK_DEFAULT_PACKAGE_WIDTH_CM: ${{ secrets.CDEK_DEFAULT_PACKAGE_WIDTH_CM || vars.CDEK_DEFAULT_PACKAGE_WIDTH_CM }}
          CDEK_DEFAULT_PACKAGE_HEIGHT_CM: ${{ secrets.CDEK_DEFAULT_PACKAGE_HEIGHT_CM || vars.CDEK_DEFAULT_PACKAGE_HEIGHT_CM }}
          CDEK_ORDER_CREATION_ENABLED: ${{ secrets.CDEK_ORDER_CREATION_ENABLED || vars.CDEK_ORDER_CREATION_ENABLED || 'true' }}
          CDEK_ORDER_TYPE: ${{ secrets.CDEK_ORDER_TYPE || vars.CDEK_ORDER_TYPE || '1' }}
          CDEK_SHIPMENT_POINT_CODE: ${{ secrets.CDEK_SHIPMENT_POINT_CODE || vars.CDEK_SHIPMENT_POINT_CODE }}
          CDEK_WEBHOOK_SECRET: ${{ secrets.CDEK_WEBHOOK_SECRET }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        shell: bash
        run: |
          set -euo pipefail

          production_env="$(mktemp)"
          clean_env="$(mktemp)"
          printf '%s\n' "$PRODUCTION_ENV_FILE" > "$production_env"
          grep -Ev '^(CONTENT_ASSISTANT_DEFAULT_BLOG_AUTHOR_ID|CONTENT_ASSISTANT_DEFAULT_BLOG_CATEGORY_ID|CONTENT_ASSISTANT_TELEGRAM_APPROVAL_CHAT_ID|CONTENT_ASSISTANT_TELEGRAM_BOT_TOKEN|CONTENT_ASSISTANT_TELEGRAM_WEBHOOK_SECRET|OPENAI_API_KEY|OPENAI_BASE_URL|OPENAI_MODEL|OPENAI_RELAY_TOKEN|UNSPLASH_ACCESS_KEY|UNSPLASH_UTM_SOURCE)=' "$production_env" > "$clean_env" || true
          mv "$clean_env" "$production_env"

          append_secret() {
            local name="$1"
            local value="$2"

            if [ -n "$value" ]; then
              local next_env

              next_env="$(mktemp)"
              grep -Ev "^${name}=" "$production_env" > "$next_env" || true
              mv "$next_env" "$production_env"
              printf '%s=%s\n' "$name" "$value" >> "$production_env"
            fi
          }

          if [ -z "$OPENAI_BASE_URL" ] && [ -n "$EDGE_PROXY_DOMAIN" ]; then
            OPENAI_BASE_URL="https://${EDGE_PROXY_DOMAIN}/v1"
          elif [ -z "$OPENAI_BASE_URL" ] && [ -n "$AI_RELAY_DOMAIN" ]; then
            OPENAI_BASE_URL="https://${AI_RELAY_DOMAIN}/v1"
          fi

          if [ -z "$TELEGRAM_API_BASE_URL" ] && [ -n "$EDGE_PROXY_DOMAIN" ]; then
            TELEGRAM_API_BASE_URL="https://${EDGE_PROXY_DOMAIN}/telegram-api"
          elif [ -z "$TELEGRAM_API_BASE_URL" ] && [ -n "$AI_RELAY_DOMAIN" ]; then
            TELEGRAM_API_BASE_URL="https://${AI_RELAY_DOMAIN}/telegram-api"
          fi

          append_secret ACME_EMAIL "$ACME_EMAIL"
          append_secret POSTGRES_DB "$POSTGRES_DB"
          append_secret POSTGRES_USER "$POSTGRES_USER"
          append_secret POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
          append_secret DATABASE_URL "$DATABASE_URL"
          append_secret SITE_URL "$SITE_URL"
          append_secret ADMIN_URL "$ADMIN_URL"
