    <use href="#front-turn" y="480" />
    <use href="#front-turn" y="520" />
    <use href="#front-turn" y="560" />
    <use href="#front-turn" y="600" />
    <use href="#front-turn" y="640" />
    <use href="#front-turn" y="680" />
    <use href="#front-turn" y="720" />
    <use href="#front-turn" y="760" />
