name: artmate

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artmate}
      POSTGRES_USER: ${POSTGRES_USER:-artmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api-migrate:
    image: ghcr.io/denisvorop/artmate-monorepo-api:${IMAGE_TAG:-latest}
    profiles: ["migrate"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
    command: ["yarn", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/denisvorop/artmate-monorepo-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
      PORT: 3002
      SITE_URL: https://www.art-mate.ru
      ADMIN_URL: https://admin.art-mate.ru
      API_PUBLIC_URL: https://api.art-mate.ru
      CORS_ORIGIN: https://www.art-mate.ru,https://admin.art-mate.ru
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes:
      - api-uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy

  site:
    image: ghcr.io/denisvorop/artmate-monorepo-site:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:3002
      API_PUBLIC_URL: https://api.art-mate.ru
      NEXT_PUBLIC_SITE_URL: https://www.art-mate.ru
    depends_on:
      - api

  admin:
    image: ghcr.io/denisvorop/artmate-monorepo-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3003
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:3002
      API_PUBLIC_URL: https://api.art-mate.ru
      NEXT_PUBLIC_SITE_URL: https://www.art-mate.ru
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - site
      - admin
      - api

volumes:
  postgres-data:
  api-uploads:
  caddy-data:
  caddy-config:
