name: artmate

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  api-migrate:
    image: ghcr.io/denisvorop/artmate-monorepo-api:${IMAGE_TAG:-latest}
    profiles: ["migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
    command: ["yarn", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/denisvorop/artmate-monorepo-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
      PORT: 3002
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      ADMIN_URL: ${ADMIN_URL:?ADMIN_URL is required}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:?AUTH_COOKIE_DOMAIN is required}
      AUTH_SUCCESS_REDIRECT_URL: ${AUTH_SUCCESS_REDIRECT_URL:?AUTH_SUCCESS_REDIRECT_URL is required}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_PASSWORD_EMAIL: ${AUTH_PASSWORD_EMAIL:-}
      AUTH_PASSWORD_NAME: ${AUTH_PASSWORD_NAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_PASSWORD_ROLES: ${AUTH_PASSWORD_ROLES:-admin,customer}
      AUTH_EMAIL_VERIFICATION_SECRET: ${AUTH_EMAIL_VERIFICATION_SECRET:?AUTH_EMAIL_VERIFICATION_SECRET is required}
      AUTH_EMAIL_VERIFICATION_CODE_TTL_SECONDS: ${AUTH_EMAIL_VERIFICATION_CODE_TTL_SECONDS:-600}
      AUTH_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${AUTH_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      AUTH_EMAIL_VERIFICATION_MAX_ATTEMPTS: ${AUTH_EMAIL_VERIFICATION_MAX_ATTEMPTS:-5}
      AUTH_EMAIL_VERIFICATION_MAX_SENDS_PER_HOUR: ${AUTH_EMAIL_VERIFICATION_MAX_SENDS_PER_HOUR:-5}
      AUTH_EMAIL_VERIFICATION_IP_MAX_SENDS_PER_HOUR: ${AUTH_EMAIL_VERIFICATION_IP_MAX_SENDS_PER_HOUR:-20}
      AUTH_TELEGRAM_LINK_CODE_SECRET: ${AUTH_TELEGRAM_LINK_CODE_SECRET:-}
      AUTH_TELEGRAM_LINK_CODE_TTL_SECONDS: ${AUTH_TELEGRAM_LINK_CODE_TTL_SECONDS:-600}
      AUTH_TELEGRAM_LINK_CODE_MAX_ATTEMPTS: ${AUTH_TELEGRAM_LINK_CODE_MAX_ATTEMPTS:-5}
      AUTH_TELEGRAM_LINK_CODE_RESEND_COOLDOWN_SECONDS: ${AUTH_TELEGRAM_LINK_CODE_RESEND_COOLDOWN_SECONDS:-60}
      AUTH_PASSWORD_RESET_SECRET: ${AUTH_PASSWORD_RESET_SECRET:?AUTH_PASSWORD_RESET_SECRET is required}
      AUTH_PASSWORD_RESET_URL: ${AUTH_PASSWORD_RESET_URL:-https://www.art-mate.ru/auth/reset-password}
      AUTH_PASSWORD_RESET_TOKEN_TTL_SECONDS: ${AUTH_PASSWORD_RESET_TOKEN_TTL_SECONDS:-1800}
      AUTH_PASSWORD_RESET_RESEND_COOLDOWN_SECONDS: ${AUTH_PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:-60}
      AUTH_PASSWORD_RESET_MAX_SENDS_PER_HOUR: ${AUTH_PASSWORD_RESET_MAX_SENDS_PER_HOUR:-5}
      AUTH_PASSWORD_RESET_IP_MAX_SENDS_PER_HOUR: ${AUTH_PASSWORD_RESET_IP_MAX_SENDS_PER_HOUR:-20}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_LOG_ONLY: ${MAIL_LOG_ONLY:-false}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_SECURE: ${SMTP_SECURE:?SMTP_SECURE is required}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      YANDEX_OAUTH_CLIENT_ID: ${YANDEX_OAUTH_CLIENT_ID:?YANDEX_OAUTH_CLIENT_ID is required}
      YANDEX_OAUTH_CLIENT_SECRET: ${YANDEX_OAUTH_CLIENT_SECRET:?YANDEX_OAUTH_CLIENT_SECRET is required}
      YANDEX_OAUTH_REDIRECT_URI: ${YANDEX_OAUTH_REDIRECT_URI:-https://api.art-mate.ru/auth/oauth/yandex/callback}
      OZON_API: ${OZON_API:-}
      OZON_API_KEY: ${OZON_API_KEY:-}
      OZON_CLIENT_ID: ${OZON_CLIENT_ID:-}
      OZON_ACQUIRING_BASE_URL: ${OZON_ACQUIRING_BASE_URL:-https://payapi.ozon.ru}
      OZON_ACQUIRING_ACCESS_KEY: ${OZON_ACQUIRING_ACCESS_KEY:?OZON_ACQUIRING_ACCESS_KEY is required}
      OZON_ACQUIRING_SECRET_KEY: ${OZON_ACQUIRING_SECRET_KEY:?OZON_ACQUIRING_SECRET_KEY is required}
      OZON_ACQUIRING_NOTIFICATION_SECRET_KEY: ${OZON_ACQUIRING_NOTIFICATION_SECRET_KEY:?OZON_ACQUIRING_NOTIFICATION_SECRET_KEY is required}
      OZON_ACQUIRING_PAYMENT_ALGORITHM: ${OZON_ACQUIRING_PAYMENT_ALGORITHM:-PAY_ALGO_SMS}
      OZON_LOGISTICS_MODE: ${OZON_LOGISTICS_MODE:-mock}
      OZON_OAUTH_ACCESS_TYPE: ${OZON_OAUTH_ACCESS_TYPE:-offline}
      OZON_OAUTH_CLIENT_ID: ${OZON_OAUTH_CLIENT_ID:-}
      OZON_OAUTH_CLIENT_SECRET: ${OZON_OAUTH_CLIENT_SECRET:-}
      OZON_OAUTH_PROMPT: ${OZON_OAUTH_PROMPT:-consent}
      OZON_OAUTH_REDIRECT_URI: ${OZON_OAUTH_REDIRECT_URI:-https://api.art-mate.ru/ozon/oauth/callback}
      OZON_OAUTH_REFRESH_TOKEN: ${OZON_OAUTH_REFRESH_TOKEN:-}
      OZON_OAUTH_SCOPE: ${OZON_OAUTH_SCOPE:-}
      CDEK_API_BASE_URL: ${CDEK_API_BASE_URL:?CDEK_API_BASE_URL is required}
      CDEK_CLIENT_ID: ${CDEK_CLIENT_ID:?CDEK_CLIENT_ID is required}
      CDEK_CLIENT_SECRET: ${CDEK_CLIENT_SECRET:?CDEK_CLIENT_SECRET is required}
      CDEK_DEFAULT_FROM_CITY_CODE: ${CDEK_DEFAULT_FROM_CITY_CODE:-44}
      CDEK_DEFAULT_TARIFF_CODE: ${CDEK_DEFAULT_TARIFF_CODE:-136}
      CDEK_DEFAULT_ITEM_WEIGHT_GRAMS: ${CDEK_DEFAULT_ITEM_WEIGHT_GRAMS:-400}
      CDEK_DEFAULT_PACKAGE_LENGTH_CM: ${CDEK_DEFAULT_PACKAGE_LENGTH_CM:-40}
      CDEK_DEFAULT_PACKAGE_WIDTH_CM: ${CDEK_DEFAULT_PACKAGE_WIDTH_CM:-30}
      CDEK_DEFAULT_PACKAGE_HEIGHT_CM: ${CDEK_DEFAULT_PACKAGE_HEIGHT_CM:-1}
      CDEK_ORDER_CREATION_ENABLED: ${CDEK_ORDER_CREATION_ENABLED:-false}
      CDEK_ORDER_TYPE: ${CDEK_ORDER_TYPE:-1}
      CDEK_SHIPMENT_POINT_CODE: ${CDEK_SHIPMENT_POINT_CODE:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_CONTACTS_CHAT_ID: ${TELEGRAM_CONTACTS_CHAT_ID:?TELEGRAM_CONTACTS_CHAT_ID is required}
      TELEGRAM_ORDERS_CHAT_ID: ${TELEGRAM_ORDERS_CHAT_ID:-}
      TELEGRAM_LINK_SERVICE_TOKEN: ${TELEGRAM_LINK_SERVICE_TOKEN:?TELEGRAM_LINK_SERVICE_TOKEN is required}
      TELEGRAM_MINI_APP_BOT_TOKEN: ${TELEGRAM_MINI_APP_BOT_TOKEN:?TELEGRAM_MINI_APP_BOT_TOKEN is required}
      TELEGRAM_MINI_APP_BOT_URL: ${TELEGRAM_MINI_APP_BOT_URL:?TELEGRAM_MINI_APP_BOT_URL is required}
      TELEGRAM_WEB_APP_URL: ${TELEGRAM_WEB_APP_URL:?TELEGRAM_WEB_APP_URL is required}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      TELEGRAM_API_RELAY_TOKEN: ${TELEGRAM_API_RELAY_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      OPENAI_RELAY_TOKEN: ${OPENAI_RELAY_TOKEN:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      UNSPLASH_UTM_SOURCE: ${UNSPLASH_UTM_SOURCE:-artmate_blog}
      CONTENT_ASSISTANT_TELEGRAM_BOT_TOKEN: ${CONTENT_ASSISTANT_TELEGRAM_BOT_TOKEN:-}
      CONTENT_ASSISTANT_TELEGRAM_APPROVAL_CHAT_ID: ${CONTENT_ASSISTANT_TELEGRAM_APPROVAL_CHAT_ID:-}
      CONTENT_ASSISTANT_TELEGRAM_WEBHOOK_SECRET: ${CONTENT_ASSISTANT_TELEGRAM_WEBHOOK_SECRET:-}
      CONTENT_ASSISTANT_DEFAULT_BLOG_AUTHOR_ID: ${CONTENT_ASSISTANT_DEFAULT_BLOG_AUTHOR_ID:-}
      CONTENT_ASSISTANT_DEFAULT_BLOG_CATEGORY_ID: ${CONTENT_ASSISTANT_DEFAULT_BLOG_CATEGORY_ID:-}
    volumes:
      - api-uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy

  site:
    image: ghcr.io/denisvorop/artmate-monorepo-site:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL is required}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:?AUTH_COOKIE_DOMAIN is required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      YANDEX_METRIKA_ID: ${YANDEX_METRIKA_ID:?YANDEX_METRIKA_ID is required}
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:?GOOGLE_ANALYTICS_ID is required}
    depends_on:
      - api

  admin:
    image: ghcr.io/denisvorop/artmate-monorepo-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      HOSTNAME: 0.0.0.0
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL is required}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:?AUTH_COOKIE_DOMAIN is required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    depends_on:
      - api

  tg:
    image: ghcr.io/denisvorop/artmate-monorepo-tg:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3002}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      TELEGRAM_LINK_SERVICE_TOKEN: ${TELEGRAM_LINK_SERVICE_TOKEN:?TELEGRAM_LINK_SERVICE_TOKEN is required}
      TELEGRAM_MINI_APP_BOT_TOKEN: ${TELEGRAM_MINI_APP_BOT_TOKEN:?TELEGRAM_MINI_APP_BOT_TOKEN is required}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
      TELEGRAM_WEB_APP_URL: ${TELEGRAM_WEB_APP_URL:?TELEGRAM_WEB_APP_URL is required}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      TELEGRAM_API_RELAY_TOKEN: ${TELEGRAM_API_RELAY_TOKEN:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_RELAY_TOKEN: ${OPENAI_RELAY_TOKEN:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - site
      - admin
      - api
      - tg

volumes:
  postgres-data:
  api-uploads:
  caddy-data:
  caddy-config:

networks:
  default:
    enable_ipv6: true
