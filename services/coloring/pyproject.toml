[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mystery-coloring"
version = "0.4.0"
description = "Standalone deterministic paint-by-numbers generator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1,<3", "opencv-python-headless>=4.10,<5", "Pillow>=11,<13",
  "shapely>=2.1,<3", "resvg_py>=0.5,<0.6", "fonttools>=4.60,<5",
  "fastapi>=0.135,<1", "uvicorn>=0.41,<1", "anime-face-detector==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
coloring-api = "mystery_coloring.studio.adapters.api:main"
coloring-worker = "mystery_coloring.studio.adapters.worker:main"
coloring-password = "mystery_coloring.studio.adapters.auth:main"
coloring-generate = "mystery_coloring.delivery.cli:main"
mystery-coloring = "mystery_coloring.cli:main"
mystery-coloring-generate = "mystery_coloring.pipeline.cli:main"
mystery-coloring-layout = "mystery_coloring.layout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
mystery_coloring = ["fonts/Arial/arialmt.ttf", "layout/assets/page-numbers.json", "details/assets/*", "details/models/*.safetensors"]

[tool.setuptools]
include-package-data = false
